services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: oficina
      POSTGRES_USER: oficina
      POSTGRES_PASSWORD: oficina
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U oficina -d oficina"]
      interval: 5s
      timeout: 3s
      retries: 10
    # dev: sobe apenas o banco para rodar ./mvnw spring-boot:run na maquina
    # full: sobe banco + aplicacao containerizada
    profiles: [dev, full]

  app:
    build: .
    environment:
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
      SPRING_PROFILES_ACTIVE: ${APP_PROFILES:-}
      OBSERVABILITY_MANAGEMENT_ADDRESS: 0.0.0.0
      DB_URL: jdbc:postgresql://postgres:5432/oficina
      DB_USERNAME: oficina_app
      DB_PASSWORD: ${APP_DB_PASSWORD:-oficina-app-local}
      # issuer publico (igual ao iss do token) e JWKS pela rede interna; lidas a partir do T18
      OAUTH2_ISSUER_URI: http://localhost:8081/realms/oficina
      OAUTH2_JWK_SET_URI: http://keycloak:8080/realms/oficina/protocol/openid-connect/certs
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      postgres-init:
        condition: service_completed_successfully
    healthcheck:
      # health na 8080; com APP_PROFILES=observability o management vai para a 9091 (ADR 0016)
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/actuator/health 2>/dev/null | grep -q UP || wget -qO- http://127.0.0.1:9091/actuator/health | grep -q UP"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 30s
    profiles: [full]

  postgres-init:
    image: postgres:17-alpine
    environment:
      PGHOST: postgres
      PGDATABASE: oficina
      PGUSER: oficina
      PGPASSWORD: oficina
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:-oficina-app-local}
      KEYCLOAK_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:-keycloak-local}
    command: ["psql", "-f", "/init/postgres-init.sql"]
    volumes:
      - ./keycloak/postgres-init.sql:/init/postgres-init.sql:ro
    depends_on:
      postgres:
        condition: service_healthy
    # one-shot idempotente: roles oficina_app/keycloak e schemas do banco unico (ADR b); roda tambem em pgdata existente
    profiles: [dev, full]

  keycloak:
    image: quay.io/keycloak/keycloak:26.8.1-1
    command: ["start-dev", "--import-realm"]
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/oficina
      KC_DB_SCHEMA: keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:-keycloak-local}
      KC_HOSTNAME: http://localhost:8081
      KC_HEALTH_ENABLED: "true"
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KC_BOOTSTRAP_ADMIN_USERNAME:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_BOOTSTRAP_ADMIN_PASSWORD:-admin-local-demo}
    volumes:
      - ./keycloak/realm-oficina.json:/opt/keycloak/data/import/realm-oficina.json:ro
    ports:
      - "127.0.0.1:8081:8080"
    depends_on:
      postgres-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && head -1 <&3 | grep -q ' 200'"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 60s
    # realm importado so na 1a subida; mudou o JSON -> reset do schema keycloak (README)
    profiles: [dev, full]

  mailpit:
    image: axllent/mailpit:v1.31.6
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 5s
      timeout: 3s
      retries: 10
    profiles: [dev, full]

  grafana:
    image: grafana/grafana:13.2.4
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-grafana-local-demo}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3000}:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped
    # Independente do banco/app; habilite explicitamente quando precisar do Grafana.
    profiles: [observability]

  prometheus:
    image: prom/prometheus:v3.15.1
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
      - --storage.tsdb.retention.size=1GB
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ${PROMETHEUS_CONFIG_FILE:-./observability/prometheus/prometheus.yml}:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:9090/-/ready"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped
    profiles: [observability]

volumes:
  pgdata:
  grafana_data:
  prometheus_data:
