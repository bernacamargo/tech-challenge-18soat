services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: oficina
      POSTGRES_USER: oficina
      POSTGRES_PASSWORD: oficina
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U oficina -d oficina"]
      interval: 5s
      timeout: 3s
      retries: 10
    # dev: sobe apenas o banco para rodar ./mvnw spring-boot:run na maquina
    # full: sobe banco + aplicacao containerizada
    profiles: [dev, full]

  app:
    build: .
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/oficina
      DB_USERNAME: oficina
      DB_PASSWORD: oficina
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    profiles: [full]

volumes:
  pgdata:
