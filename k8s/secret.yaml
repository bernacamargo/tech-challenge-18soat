# ATENÇÃO: placeholders apenas para `kubectl apply` local/demo.
# Em ambiente real, crie o Secret fora do Git:
#   kubectl -n oficina create secret generic oficina-secrets \
#     --from-literal=DB_USERNAME=oficina_app \
#     --from-literal=DB_PASSWORD='...' \
#     --dry-run=client -o yaml | kubectl apply -f -
apiVersion: v1
kind: Secret
metadata:
  name: oficina-secrets
  namespace: oficina
  labels:
    app.kubernetes.io/name: oficina
type: Opaque
stringData:
  DB_USERNAME: "oficina_app"
  DB_PASSWORD: "CHANGE_ME"
