apiVersion: apps/v1
kind: Deployment
metadata:
  name: oficina
  namespace: oficina
  labels:
    app.kubernetes.io/name: oficina
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: oficina
  template:
    metadata:
      labels:
        app.kubernetes.io/name: oficina
    spec:
      containers:
        - name: oficina
          # Pin da imagem publicada pelo release.yml (ADR 0019). O deploy.yml sobrescreve a tag.
          image: ghcr.io/bernacamargo/tech-challenge-18soat:0.1.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: oficina-config
            - secretRef:
                name: oficina-secrets
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            initialDelaySeconds: 40
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
