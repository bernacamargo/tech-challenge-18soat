spring:
  application:
    name: oficina
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/oficina}
    username: ${DB_USERNAME:oficina_app}
    password: ${DB_PASSWORD:oficina-app-local}
  mail:
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:1025}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail.smtp:
        auth: ${SMTP_AUTH:false}
        starttls.enable: ${SMTP_STARTTLS:false}
        connectiontimeout: 3000
        timeout: 3000
        writetimeout: 3000
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  security:
    oauth2:
      resourceserver:
        jwt:
          # Issuer publico (o "iss" que o Keycloak emite), comparado por igualdade exata; sem barra final
          issuer-uri: ${OAUTH2_ISSUER_URI:http://localhost:8081/realms/oficina}
          # JWKS: no perfil full o compose aponta para o endereco interno (T16); local usa o default
          jwk-set-uri: ${OAUTH2_JWK_SET_URI:http://localhost:8081/realms/oficina/protocol/openid-connect/certs}
          # FIXO, sem env: lista vazia desliga a validacao de aud em silencio
          audiences: oficina-api
          # FIXO: so RS256 (nao usar jws-algorithm, singular)
          jws-algorithms: RS256

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html

oficina:
  notificacoes:
    habilitadas: ${NOTIFICACOES_HABILITADAS:true}
    remetente: ${SMTP_FROM:no-reply@oficina.local}
    intervalo-ms: 5000
