name: security

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 6 * * 1' # toda segunda-feira 06:00 UTC
  workflow_dispatch:

jobs:
  dependency-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Cache NVD database
        uses: actions/cache@v4
        with:
          path: ~/.dependency-check-data
          key: nvd-db-${{ github.run_id }}
          restore-keys: nvd-db-

      # Exige a secret NVD_API_KEY (chave gratuita da NVD); sem ela a analise de
      # CVEs nao roda e nenhum relatorio e gerado (o job fica verde de forma
      # enganosa por causa do failOnError=false).
      - name: OWASP Dependency-Check (CVE nas dependencias)
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: >
          ./mvnw -B -DskipTests dependency-check:check
          -DdataDirectory=$HOME/.dependency-check-data
          -DfailOnError=false

      - name: Upload relatorio de analise de vulnerabilidades
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vulnerability-report
          path: |
            target/dependency-check-report.html
            target/dependency-check-report.json
          if-no-files-found: ignore
