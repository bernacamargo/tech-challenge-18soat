name: security

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 6 * * 1' # toda segunda-feira 06:00 UTC
  workflow_dispatch:

jobs:
  dependency-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # Base NVD (~116 MB): chave semanal + save apenas quando nao houver hit.
      # Caches do GitHub sao evitadas apos 7 dias sem acesso e limitadas a 10 GB
      # por repositorio; o cron semanal renova o acesso e a chave nova da semana
      # permite a atualizacao da base sem replicar 116 MB a cada run.
      # ATENCAO: cache em feature branch so e visivel para ela mesma e para a
      # main — branches que nao derivam da main refazem o download (uma vez).
      - name: Resolver semana corrente para a chave da cache NVD
        id: nvd-week
        run: echo "week=$(date -u +%G-W%V)" >> "$GITHUB_OUTPUT"

      - name: Cache NVD database
        id: nvd-cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.dependency-check-data
          key: nvd-db-${{ steps.nvd-week.outputs.week }}
          restore-keys: nvd-db-

      # Exige a secret NVD_API_KEY (chave gratuita da NVD); sem ela a analise de
      # CVEs nao roda e nenhum relatorio e gerado (o job fica verde de forma
      # enganosa por causa do failOnError=false).
      - name: OWASP Dependency-Check (CVE nas dependencias)
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: >
          ./mvnw -B -DskipTests dependency-check:check
          -DdataDirectory=$HOME/.dependency-check-data
          -DfailOnError=false

      - name: Salvar cache NVD (apenas quando restaurou de chave antiga)
        if: steps.nvd-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.dependency-check-data
          key: nvd-db-${{ steps.nvd-week.outputs.week }}

      - name: Upload relatorio de analise de vulnerabilidades
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vulnerability-report
          path: |
            target/dependency-check-report.html
            target/dependency-check-report.json
          if-no-files-found: ignore
