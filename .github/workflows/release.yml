name: release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write
  packages: write
  checks: read

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/tech-challenge-18soat

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validar tag semver e commit em main
        id: meta
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Tag '$TAG' nao segue vMAJOR.MINOR.PATCH (ex.: v0.1.0)."
            exit 1
          fi
          VERSION="${TAG#v}"
          SHA="${GITHUB_SHA}"

          git fetch origin main
          if ! git merge-base --is-ancestor "$SHA" origin/main; then
            echo "::error::Commit $SHA da tag $TAG nao e ancestral de origin/main."
            exit 1
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "sha_short=${SHA:0:7}" >> "$GITHUB_OUTPUT"

      - name: Validar check ci do commit
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          SHA="${GITHUB_SHA}"
          # Em tag push o check ja rodou no merge em main; so consultamos o status.
          # Aceita se existir ao menos um check-run "ci" com conclusion=success.
          HAS_SUCCESS=$(gh api \
            "repos/${REPOSITORY}/commits/${SHA}/check-runs" \
            --paginate \
            --jq '[.check_runs[] | select(.name == "ci" and .conclusion == "success")] | length')
          if [ "${HAS_SUCCESS:-0}" = "0" ]; then
            echo "::error::Check 'ci' do commit $SHA nao esta success."
            exit 1
          fi
          echo "Check ci = success para $SHA"

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build e push da imagem
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.version }}
            ${{ env.IMAGE_NAME }}:sha-${{ steps.meta.outputs.sha_short }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Criar GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG ja existe; pulando criacao."
            exit 0
          fi
          gh release create "$TAG" \
            --generate-notes \
            --title "$TAG" \
            --verify-tag
